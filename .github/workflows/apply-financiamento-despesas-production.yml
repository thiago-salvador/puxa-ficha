name: Aplicar despesas de campanha

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA de 40 caracteres já mergeado em main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Despesas de campanha 20260929100000, ledger e readback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    # PF_DATABASE_URL fica no env de cada passo que o usa, nunca no job: assim
    # o segredo não alcança npm ci, a prova local nem as actions de terceiros.
    env:
      PF_EXPECTED_SHA: ${{ inputs.expected_sha }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - name: Validar dispatch manual e SHA fechado
        env:
          DISPATCH_SHA: ${{ github.sha }}
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$PF_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PF_EXPECTED_SHA" = "$DISPATCH_SHA"
          test -n "${PF_DATABASE_URL:-}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # O runner usa só node embutido, python3 da stdlib e psql.
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      - name: Provar ACL, CHECKs, idempotência, readback e rollback em PostgreSQL 17 descartável
        run: bash scripts/audit/provar-financiamento-despesas-pg17.sh
      - name: Aplicar migration fechada em produção
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/apply-financiamento-despesas-production.sh

  # Mesmo POST /api/revalidate dos jobs `revalidate` de ingest.yml e
  # tse-2026-financas.yml. Sem ele, fichas aquecidas com a view ainda ausente
  # ("ausente") seguiriam sem a seção de despesas até o TTL de 12 h. Falha o
  # workflow se a resposta não confirmar a tag da ficha.
  revalidate:
    name: Revalidar cache público da ficha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [apply]
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    env:
      REVALIDATE_URL: https://puxaficha.com.br/api/revalidate
      REVALIDATE_SECRET: ${{ secrets.PF_REVALIDATE_SECRET }}
      TAGS_JSON: '["public-candidato-ficha"]'
    steps:
      - name: POST /api/revalidate
        run: |
          set -euo pipefail
          if [ -z "${REVALIDATE_SECRET:-}" ]; then
            echo "PF_REVALIDATE_SECRET ausente nos GitHub Actions secrets." >&2
            exit 1
          fi
          jq -cn --argjson tags "$TAGS_JSON" '{tags: $tags}' > /tmp/payload.json
          status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$REVALIDATE_URL" \
            -H "content-type: application/json" \
            -H "x-pf-revalidate-secret: ${REVALIDATE_SECRET}" \
            --data-binary @/tmp/payload.json)"
          echo "HTTP ${status}"
          jq -c . /tmp/resp.json || cat /tmp/resp.json
          echo "HTTP ${status}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "200" ]; then exit 1; fi
          if ! jq -e '.ok == true and (.revalidated | index("public-candidato-ficha"))' /tmp/resp.json > /dev/null; then
            echo "FAIL: revalidação de public-candidato-ficha não confirmada" >&2
            exit 1
          fi
