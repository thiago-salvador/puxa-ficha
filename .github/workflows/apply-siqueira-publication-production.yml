name: Publicar candidatura com fonte direta do TSE

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA de 40 caracteres já mergeado em main"
        required: true
        type: string
      mode:
        description: "dry-run aplica com rollback final; apply persiste; verify somente lê"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
          - verify

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Chapa, candidatura e fonte oficial com readbacks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      PF_EXPECTED_SHA: ${{ inputs.expected_sha }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - name: Validar dispatch manual, SHA fechado e modo permitido
        env:
          DISPATCH_SHA: ${{ github.sha }}
          REMEDIATION_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$PF_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PF_EXPECTED_SHA" = "$DISPATCH_SHA"
          case "$REMEDIATION_MODE" in dry-run|apply|verify) ;; *) exit 2 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      - name: Provar forward, adulteração, concorrência, rollback e readbacks em PostgreSQL 17 descartável
        run: bash scripts/audit/provar-siqueira-publication-pg17.sh
      - name: Backup read-only restrito, cifrado e validado antes de qualquer escrita
        if: inputs.mode != 'verify'
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: bash scripts/audit/apply-siqueira-publication-production.sh backup "$RUNNER_TEMP/siqueira-backup"
      - name: Preservar somente backup cifrado e checksum
        if: inputs.mode != 'verify'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: siqueira-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/siqueira-backup/closeout.dump.enc
            ${{ runner.temp }}/siqueira-backup/closeout.dump.enc.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Conferir identidade, bens e documentos na fonte oficial atual
        if: inputs.mode != 'verify'
        run: node --import tsx scripts/audit/verify-siqueira-official-source.ts
      - name: Provar pacote completo com rollback antes de persistir
        if: inputs.mode == 'apply'
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/apply-siqueira-publication-production.sh dry-run
      - name: Executar modo autorizado pelo driver guardado
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          REMEDIATION_MODE: ${{ inputs.mode }}
        run: bash scripts/audit/apply-siqueira-publication-production.sh "$REMEDIATION_MODE"
