name: "Reverter quarentena ampliada de gastos parlamentares"

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA de 40 caracteres já mergeado em main"
        required: true
      mode:
        description: "dry-run ensaia o rollback e desfaz; apply reverte. O ensaio roda sempre antes."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback da 20260925221042
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # PF_DATABASE_URL fica no env de cada passo que o usa, nunca no job.
    env:
      PF_EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - name: Validar ref e input
        env:
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          PF_MODE: ${{ github.event.inputs.mode }}
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          [[ "$PF_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PF_EXPECTED_SHA" = "$DISPATCH_SHA"
          test -n "${PF_DATABASE_URL:-}"
          case "$PF_MODE" in dry-run|apply) ;; *) echo "modo inválido: $PF_MODE" >&2; exit 1 ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.expected_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12

      # O ensaio roda rollback e readback de rollback na mesma transação e
      # termina em ROLLBACK; o modo apply só roda depois dele.
      - name: Ensaio do rollback (dry-run, não grava)
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/rollback-gastos-parlamentares-quarentena-universo-production.sh dry-run

      - name: Reverter a quarentena ampliada
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/rollback-gastos-parlamentares-quarentena-universo-production.sh apply
