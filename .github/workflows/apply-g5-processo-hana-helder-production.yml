name: "Aplicar G5: processo 0009421-71.2009.4.01.3900 em duas fichas"

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA de 40 caracteres já mergeado em main"
        required: true
      mode:
        description: "dry-run ensaia e desfaz; apply grava. O ensaio roda sempre antes."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Migration G5 (1 processo, 2 fichas) com ledger e readback
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PF_EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
    steps:
      - name: Validar ref e input
        env:
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          PF_MODE: ${{ github.event.inputs.mode }}
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          [[ "$PF_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PF_EXPECTED_SHA" = "$DISPATCH_SHA"
          test -n "${PF_DATABASE_URL:-}"
          case "$PF_MODE" in dry-run|apply) ;; *) echo "modo inválido: $PF_MODE" >&2; exit 1 ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.expected_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12

      - run: npm ci --ignore-scripts

      - name: Ensaio (dry-run, não grava)
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/apply-g5-processo-hana-helder-production.sh dry-run

      - name: Aplicar conjunto fechado
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/apply-g5-processo-hana-helder-production.sh apply

  # Mesmo POST /api/revalidate do apply das despesas. Sem ele, as duas fichas
  # seguem sem o processo novo até o TTL de 12 h. Só roda depois de gravar.
  revalidate:
    name: Revalidar cache público da ficha
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [apply]
    if: ${{ success() && github.ref == 'refs/heads/main' && github.event.inputs.mode == 'apply' }}
    env:
      REVALIDATE_URL: https://puxaficha.com.br/api/revalidate
      REVALIDATE_SECRET: ${{ secrets.PF_REVALIDATE_SECRET }}
      TAGS_JSON: '["public-candidato-ficha"]'
    steps:
      - name: POST /api/revalidate
        run: |
          set -euo pipefail
          if [ -z "${REVALIDATE_SECRET:-}" ]; then
            echo "PF_REVALIDATE_SECRET ausente nos GitHub Actions secrets." >&2
            exit 1
          fi
          jq -cn --argjson tags "$TAGS_JSON" '{tags: $tags}' > /tmp/payload.json
          status="$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$REVALIDATE_URL" \
            -H "content-type: application/json" \
            -H "x-pf-revalidate-secret: ${REVALIDATE_SECRET}" \
            --data-binary @/tmp/payload.json)"
          echo "HTTP ${status}"
          jq -c . /tmp/resp.json || cat /tmp/resp.json
          echo "HTTP ${status}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "200" ]; then exit 1; fi
          if ! jq -e '.ok == true and (.revalidated | index("public-candidato-ficha"))' /tmp/resp.json > /dev/null; then
            echo "FAIL: revalidação de public-candidato-ficha não confirmada" >&2
            exit 1
          fi
