name: Coleta judicial por candidato

# Renova os recibos judiciais (processos-curadoria) antes do SLA de 14 dias
# exibido no site e busca candidatos públicos ainda sem recibo. Grava apenas
# recibos em coleta_log pelo aplicador auditado; nunca grava em processos.
# Falha da coleta vira recibo `erro` por alvo, nunca silêncio.
# Evidência nominal fica só no runner: o log e o resumo públicos têm contagens.
# O backup pré-escrita que o aplicador grava no runner é descartado ao fim do
# job, de propósito: coleta_log é append-only e mantém os recibos anteriores,
# então a trilha de rollback é o próprio banco, não um artefato de repo público.

on:
  schedule:
    # Segunda e quinta: nenhum recibo conclusivo passa de 14 dias com margem de 5.
    - cron: "17 9 * * 1,4"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Gravar recibos em coleta_log (false = só dry-run)"
        required: true
        default: false
        type: boolean
      margem_dias:
        description: "Renovar recibos conclusivos com idade >= 14 - margem"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

# Mesmo grupo do ingest.yml: coleta judicial e ingest não disputam o banco nem
# o limite das fontes oficiais; nenhuma execução cancela outra.
concurrency:
  group: ingest-pipeline
  cancel-in-progress: false

jobs:
  coletar:
    name: Renovar recibos judiciais e cobrir candidatos sem recibo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APLICAR: ${{ github.event_name == 'schedule' || inputs.aplicar == true }}
      MARGEM_DIAS: ${{ inputs.margem_dias || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      - name: Validar segredos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          for nome in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!nome:-}" ]; then echo "::error::$nome ausente" >&2; exit 1; fi
          done
      - name: Conferir recibos antes da coleta
        id: antes
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atq \
            -f scripts/audit/processos-coverage-snapshot.sql > "$RUNNER_TEMP/recibos-antes.json"
          node --import tsx scripts/audit/check-processos-receipts.ts \
            --input="$RUNNER_TEMP/recibos-antes.json" | tee "$RUNNER_TEMP/recibos-antes-resumo.json"
      - name: Coletar e aplicar (renovação e sem recibo)
        id: coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          umask 077
          falhas=0
          for modo in vencendo sem-recibo; do
            evidencia="$RUNNER_TEMP/processos-$modo.evidence.json"
            if [ "$modo" = "vencendo" ]; then
              set -- --alvos=vencendo --margem-dias="$MARGEM_DIAS"
            else
              set -- --alvos=sem-recibo
            fi
            if PF_DRY_RUN=1 node --import tsx scripts/curadoria-processos-lote.ts \
                --coorte-atual --dry-run "$@" \
                --evidence="$evidencia" --cache="$RUNNER_TEMP/processos-cache" \
                > "$RUNNER_TEMP/coleta-$modo.log" 2>&1; then
              if [ ! -f "$evidencia" ]; then
                echo "$modo: nenhum alvo" | tee -a "$RUNNER_TEMP/resumo-coleta.txt"
                continue
              fi
              node -e 'const x=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));console.log(process.argv[2]+": "+JSON.stringify(x.resumo))' \
                "$evidencia" "$modo" | tee -a "$RUNNER_TEMP/resumo-coleta.txt"
              if [ "$APLICAR" = "true" ]; then
                if ! node --import tsx scripts/aplicar-evidencia-processos-curadoria.ts --apply \
                    --evidence="$evidencia" > "$RUNNER_TEMP/aplicar-$modo.log" 2>&1; then
                  echo "::error::Aplicador falhou em $modo; log privado retido no runner." >&2
                  falhas=$((falhas + 1))
                else
                  tail -n 1 "$RUNNER_TEMP/aplicar-$modo.log" \
                    | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);console.log(JSON.stringify({inseridos:x.candidatos_inseridos,pulados:x.candidatos_pulados,readback:x.readback.conferidos,divergentes:x.readback.divergentes.length}))})' \
                    | sed "s/^/$modo aplicado: /" | tee -a "$RUNNER_TEMP/resumo-coleta.txt"
                fi
              else
                node --import tsx scripts/aplicar-evidencia-processos-curadoria.ts --dry-run \
                  --evidence="$evidencia" > "$RUNNER_TEMP/aplicar-$modo.log" 2>&1 \
                  || { echo "::error::Dry-run do aplicador falhou em $modo." >&2; falhas=$((falhas + 1)); }
              fi
            else
              echo "::error::Coleta $modo interrompida; log privado retido no runner." >&2
              falhas=$((falhas + 1))
              snapshot="$evidencia.snapshot.json"
              tipo="sem_classificacao"
              if [ -f "$evidencia.falha.json" ]; then
                tipo="$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).tipo)' "$evidencia.falha.json")"
              fi
              echo "$modo falhou: $tipo" | tee -a "$RUNNER_TEMP/resumo-coleta.txt"
              if [ -f "$snapshot" ] && [ "$APLICAR" = "true" ]; then
                if node --import tsx scripts/registrar-erro-coleta-processos.ts --apply \
                    --snapshot="$snapshot" --tipo="$tipo" --modo="$modo" > "$RUNNER_TEMP/erro-$modo.log" 2>&1; then
                  tail -n 1 "$RUNNER_TEMP/erro-$modo.log" | sed "s/^/$modo recibos de erro: /" | tee -a "$RUNNER_TEMP/resumo-coleta.txt"
                else
                  echo "::error::Não foi possível gravar os recibos de erro de $modo." >&2
                fi
              elif [ ! -f "$snapshot" ]; then
                echo "::error::Coleta $modo caiu antes do snapshot de alvos; sem recibo possível." >&2
              fi
            fi
          done
          if [ "$falhas" -gt 0 ]; then exit 1; fi
      - name: Conferir recibos depois da coleta
        id: depois
        if: always() && steps.antes.outcome != 'skipped'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atq \
            -f scripts/audit/processos-coverage-snapshot.sql > "$RUNNER_TEMP/recibos-depois.json"
          node --import tsx scripts/audit/check-processos-receipts.ts \
            --input="$RUNNER_TEMP/recibos-depois.json" | tee "$RUNNER_TEMP/recibos-depois-resumo.json"
      - name: Publicar resumo sem dados nominais
        if: always()
        run: |
          {
            echo "## Coleta judicial por candidato"
            echo "Aplicar: $APLICAR · margem: $MARGEM_DIAS dias"
            echo "Backup pré-escrita descartado com o runner; coleta_log é append-only."
            for f in recibos-antes-resumo.json resumo-coleta.txt recibos-depois-resumo.json; do
              if [ -f "$RUNNER_TEMP/$f" ]; then echo; echo "### $f"; echo '```'; cat "$RUNNER_TEMP/$f"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
