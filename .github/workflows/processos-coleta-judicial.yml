name: Coleta judicial por candidato

# A coleta judicial (renovação dos recibos processos-curadoria antes do SLA de
# 14 dias, reexame de indeterminados e busca de candidatos sem recibo) roda no
# Mac pelo agente launchd de scripts/processos-local/, segunda e quinta às
# 09:17 UTC: a API do DJEN responde HTTP 403 ao runner hospedado (issue #582).
# Runbook: docs/operations/processos-local.md.
#
# Este workflow não consulta DJEN nem DataJud e não grava nada. Ele só confere
# a consistência dos recibos no banco com o mesmo checker de 14 dias, três
# horas depois da coleta local, e publica um resumo só com contagens. Recibo
# ausente ou inválido continua reprovando a execução.

on:
  schedule:
    # Segunda e quinta, 3 h depois da coleta local de 09:17 UTC.
    - cron: "17 12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

# Mesmo grupo do ingest.yml: a leitura não disputa o banco com um ingest em
# curso; nenhuma execução cancela outra.
concurrency:
  group: ingest-pipeline
  cancel-in-progress: false

jobs:
  conferir:
    name: Conferir recibos judiciais da coorte pública
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      - name: Validar segredo
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then echo "::error::SUPABASE_DB_URL ausente" >&2; exit 1; fi
      - name: Conferir recibos
        id: recibos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          umask 077
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atq \
            -f scripts/audit/processos-coverage-snapshot.sql > "$RUNNER_TEMP/recibos.json"
          node --import tsx scripts/audit/check-processos-receipts.ts \
            --input="$RUNNER_TEMP/recibos.json" | tee "$RUNNER_TEMP/recibos-resumo.json"
      - name: Publicar resumo sem dados nominais
        if: always()
        run: |
          {
            echo "## Recibos judiciais por candidato"
            echo "Coleta: agente local (scripts/processos-local/). Este job só confere os recibos."
            if [ -f "$RUNNER_TEMP/recibos-resumo.json" ]; then
              echo; echo '```'; cat "$RUNNER_TEMP/recibos-resumo.json"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
