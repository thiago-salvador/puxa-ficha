name: Atualização e completude dos dados

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      sourcepack_candidates:
        description: "Escopo opcional SQ:UF:slug separado por vírgulas para o sourcepack TSE"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: data-freshness-audit
  cancel-in-progress: false

jobs:
  auditar:
    name: Fonte oficial, candidaturas e SLA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      - name: Validar acesso de leitura
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL ausente. É o mesmo secret do backup-db.yml." >&2
            exit 1
          fi
      - name: Gerar snapshot publicado em transação somente leitura
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p reports/data-freshness
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atq \
            -f scripts/audit/data-freshness-snapshot.sql \
            > reports/data-freshness/published.json
      - name: Comparar fonte oficial, catálogo e SLAs
        id: audit
        continue-on-error: true
        run: npm run audit:data-freshness -- --strict --published=reports/data-freshness/published.json
      - name: Monitorar julgamentos e arquivos dependentes do TSE
        id: tse_monitors
        continue-on-error: true
        run: npm run audit:data-freshness:tse-dependent
      # Recibo global da leitura oficial do TSE em coleta_log, lido por
      # /imprensa/frescor. As credenciais de escrita ficam só neste step; a
      # auditoria acima segue com a conexão em modo somente leitura. Sem elas,
      # o script só avisa; com elas, falha se o recibo não for gravado.
      - name: Registrar recibo da leitura oficial do TSE
        id: tse_receipt
        if: always() && steps.audit.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run audit:data-freshness:tse-receipt
      - name: Publicar resumo no run
        if: always()
        run: |
          if [ -f reports/data-freshness/summary.md ]; then
            cat reports/data-freshness/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Auditoria sem resumo" >> "$GITHUB_STEP_SUMMARY"
            echo "O snapshot ou o processo falhou antes de gerar os artefatos." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/data-freshness/tse-dependent-monitors/summary.md ]; then
            cat reports/data-freshness/tse-dependent-monitors/summary.md >> "$GITHUB_STEP_SUMMARY"
            cat reports/data-freshness/tse-dependent-monitors/summary.md >> reports/data-freshness/summary.md
          fi
      - name: Preservar evidências
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6.0.0
        with:
          name: data-freshness-${{ github.run_id }}
          path: reports/data-freshness/
          if-no-files-found: error
          retention-days: 30
      - name: Bloquear quando houver erro de fonte ou revisão pendente
        if: always() && (steps.audit.outcome != 'success' || steps.tse_monitors.outcome != 'success')
        run: |
          set -euo pipefail
          echo "::error::A auditoria exige revisão. Consulte summary.md e diff.json no artefato." >&2
          exit 1

  coletar-sourcepack:
    name: Coletar sourcepack TSE sob demanda
    if: inputs.sourcepack_candidates != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Executar sourcepack parametrizado
        env:
          SOURCEPACK_CANDIDATES: ${{ inputs.sourcepack_candidates }}
          SOURCEPACK_OUTPUT_DIR: reports/data-freshness/sourcepack
        run: |
          set -euo pipefail
          node --import tsx scripts/audit/collect-freshness-closeout-sourcepack.ts
      - name: Preservar sourcepack e diagnóstico
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6.0.0
        with:
          name: data-freshness-sourcepack-${{ github.run_id }}
          path: reports/data-freshness/sourcepack/
          if-no-files-found: error
          retention-days: 30

  # Gate de cobertura: toda ficha pública
  # precisa de recibo de fonte em cada família aplicável. Lê os perfis pela API
  # pública e os recibos por candidato em transação somente leitura. Começa em
  # modo aviso; depois de duas execuções limpas (GATE_SEM_RECIBO cells=0 no
  # log), o dono troca a variável de repositório COVERAGE_GATE_MODE para
  # "enforce" e o job passa a reprovar. Exceções nominais aprovadas vão em
  # data/cobertura-excecoes.json, quando o arquivo existir.
  cobertura:
    name: Gate de cobertura das fichas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      - name: Exportar recibos por candidato em transação somente leitura
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL ausente. É o mesmo secret do backup-db.yml." >&2
            exit 1
          fi
          # Fora de reports/: o detalhe antigo de alguns recibos tem dado pessoal
          # e este arquivo não pode ir para artefato.
          umask 077
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atq \
            -f scripts/audit/coverage-receipts-snapshot.sql \
            > "$RUNNER_TEMP/coverage-receipts.json"
      - name: Matriz e gate de recibos
        env:
          COVERAGE_GATE_MODE: ${{ vars.COVERAGE_GATE_MODE || 'warn' }}
        run: |
          set -euo pipefail
          mkdir -p reports/cobertura
          exceptions=()
          if [ -f data/cobertura-excecoes.json ]; then exceptions=(--exceptions=data/cobertura-excecoes.json); fi
          npm run audit:cobertura-fichas -- \
            --receipts="$RUNNER_TEMP/coverage-receipts.json" \
            --out=reports/cobertura/matriz.json \
            --gate=sem-recibo --mode="$COVERAGE_GATE_MODE" \
            "${exceptions[@]}" | tee reports/cobertura/resumo.log
          {
            echo "## Gate de cobertura (modo $COVERAGE_GATE_MODE)"
            grep -E '^GATE_SEM_RECIBO' reports/cobertura/resumo.log || echo "sem linha GATE_SEM_RECIBO"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preservar matriz (sem recibos brutos)
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6.0.0
        with:
          name: cobertura-fichas-${{ github.run_id }}
          path: reports/cobertura/
          if-no-files-found: warn
          retention-days: 30

  notificar:
    name: Criar ou encerrar alerta acionável
    needs: auditar
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recuperar evidências da auditoria
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: data-freshness-${{ github.run_id }}
          path: reports/data-freshness/
      - name: Sincronizar incidente destacado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/audit/sync-data-freshness-issue.sh \
            '${{ needs.auditar.result }}' \
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            reports/data-freshness/summary.md \
            thiago-salvador
