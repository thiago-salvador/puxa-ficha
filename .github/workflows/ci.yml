name: CI

# Roda em pushes e em PRs de qualquer fork. Não usa segredos, então
# funciona para qualquer colaborador externo sem acesso à infra do projeto.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Falha em vulnerabilidade high+ nas dependencias de producao (o que vai
      # pro browser/runtime). devDependencies (CLIs locais) ficam fora do gate.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Spellcheck (UI)
        run: npm run lint:spell:ui

      - name: Typecheck
        run: npm run typecheck

      # Os scripts de ingestão/auditoria têm tsconfig próprio e ficam fora do
      # typecheck do app; sem este passo, um script quebrado só falharia na
      # hora de rodar a ingestão agendada.
      - name: Typecheck (scripts)
        run: npm run check:scripts

      # Valida data/candidatos.json (contrato, slugs únicos, colisões de
      # nome_urna, SQ duplicado). Local e sem segredo, então roda em qualquer
      # PR de fork. Sem este gate, um seed inválido passa no CI e só explode
      # na ingestão.
      - name: Validar seed
        run: npm run validate:seed

      # Foto de origem abaixo do slot em 2x (562x750) sai borrada na grade da
      # home; recompressão não conserta resolução que nunca existiu (G5-02).
      - name: Resolução das fotos de candidato
        run: npm run audit:fotos:gate

      - name: Dead code (knip)
        run: npm run check:dead-code

      # Escrita em produção fora de `escreverAuditado()` é escrita sem trilha, que
      # é a causa raiz da #131. A varredura é estática (lê `scripts/` e `src/`, não
      # toca no banco), então roda em PR de fork sem segredo nenhum. Gate que
      # ninguém executa é o padrão que esta issue existe para quebrar.
      - name: Escrita auditada (trilha obrigatória)
        run: npm run audit:escrita-auditada:gate

      # Migration de dados nova exige três coisas no mesmo PR: anotações `@write`,
      # allowlist que autorize os pares (tabela, slug, campos) e entrada em
      # `recortes.json` ligando a janela à allowlist. O comando é estático, não
      # toca banco nem rede, então roda em PR de fork sem segredo nenhum.
      # Entrou no verify porque até 09/08/2026 ele saía vermelho por construção,
      # e gate que ninguém executa vira gate desligado: dois documentos chegaram
      # a declarar "allowlist OK" com ele em exit 1.
      - name: Allowlist de escrita (recortes e dívida congelada)
        run: npm run audit:cobertura:allowlist

      - name: Test
        run: npm test

      - name: Build
        # Valores de placeholder: o build não acessa o Supabase (as páginas
        # são renderizadas sob demanda). Um fork usa os próprios valores.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  # A cobertura saiu do `verify` em 18/08/2026, medida antes de mexer: levava 347
  # dos 651 segundos do job, mais da metade, e tem `continue-on-error: true`, ou
  # seja nao pode reprovar nada. O comando roda a suite inteira uma SEGUNDA vez
  # com --test-concurrency=1, serial, o que explica ser quase o dobro do step
  # `Test`. Ninguem podia mergear enquanto um numero informativo era calculado.
  # Em job proprio ela roda em paralelo e sai do caminho critico.
  cobertura:
    name: Cobertura (informativa)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Thresholds do c8.config.json, que existiam mas nunca eram executados em
      # lugar nenhum. Informativa por decisao de 2026-08-04: reporta queda de
      # cobertura sem derrubar o CI. Avaliar promover a bloqueante.
      - name: Cobertura
        continue-on-error: true
        run: npm run test:coverage:raw

  # O unico teste que pegaria a regressao de CSP de 03/08 (PR #71, nonce
  # removido, toda hidratacao bloqueada por ~12h) nunca rodava em PR:
  # main-routes falha em qualquer erro de console, e script inline barrado por
  # CSP sem nonce e exatamente esse sintoma. Este job builda o site em modo
  # producao (CSP com nonce, sem 'unsafe-inline') usando env placeholder (sem
  # segredo, funciona em PR de fork) e roda o teste contra o servidor local
  # que o playwright.config sobe sozinho. Rotas que so renderizam com dados
  # reais ficam de fora via PF_EXPECT_PLACEHOLDER_DATA: a CSP e global
  # (middleware + layout raiz), entao as rotas restantes detectam a mesma
  # classe de regressao. Prova registrada em 2026-08-04: com o nonce removido
  # localmente, todas as rotas falham com "Executing inline script violates
  # the following Content Security Policy directive 'script-src self'".
  browser-smoke:
    name: Rotas e acessibilidade (build local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sem cache, cada rodada baixava de novo os ~250 MB de Chromium e WebKit.
      # Medido em 18/08/2026, sete execucoes do mesmo dia: 48s, 59s, 65s, 80s,
      # 136s, 287s e 1487s. A ultima nao terminou, foi morta pelo timeout do job
      # e levou o PR com ela. Variacao de 30x nao e volume de download: e o
      # apt-get do --with-deps travando.
      # A chave e a VERSAO do Playwright, nao o hash do package-lock. Com o
      # lock inteiro, qualquer bump de dependencia invalidaria os 363 MB de
      # navegador, e o dependabot deste repo roda toda segunda com ate 4 PRs:
      # o cache viveria menos de uma semana. Os binarios so mudam quando a
      # versao do Playwright muda. Lido do lockfile, que existe antes do npm ci.
      - name: Versao do Playwright, para a chave do cache
        id: pw-versao
        run: |
          echo "v=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache dos navegadores do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-versao.outputs.v }}

      # WebKit e obrigatorio, nao escolha: o projeto `mobile` do
      # playwright.config emula iPhone 14, e todo device iPhone do Playwright
      # roda em WebKit. O --with-deps tambem fica, porque o WebKit depende de
      # bibliotecas (libwoff, libhyphen, libmanette) que a imagem do runner nao
      # traz. O que muda e a resiliencia: cada tentativa morre em 6 min em vez
      # de pendurar ate os 25 do job, e tenta de novo, porque trava de apt e
      # transitoria.
      # A causa raiz do travamento, achada no log de 18/08: o apt do runner tenta
      # o mirror azure.archive.ubuntu.com, que responde Ign, e fica pendurado sem
      # timeout. Com estes limites ele desiste do mirror morto em 15s e cai no
      # archive.ubuntu.com, que responde.
      - uses: ./.github/actions/pin-apt-mirrors

      # WebKit e obrigatorio, nao escolha: o projeto `mobile` do
      # playwright.config emula iPhone 14, e todo device iPhone do Playwright
      # roda em WebKit. O --with-deps tambem fica, porque o WebKit depende de
      # bibliotecas (libwoff, libhyphen, libmanette) que a imagem do runner nao
      # traz.
      #
      # O `timeout` mata o processo pai, mas o apt-get NETO sobrevive segurando
      # /var/lib/apt/lists/lock, e por isso a segunda tentativa morria em 2s com
      # "Could not get lock ... held by process". Medido na primeira execucao
      # desta mudanca. Por isso a limpeza entre tentativas.
      # Separado em DOIS passos de proposito. Juntos, num --with-deps unico, o
      # cache nunca ajudava: o apt roda toda vez, e ele e a parte lenta e
      # instavel. Separando, o cache mata de fato o download de ~250 MB de
      # navegador, e sobra so o apt.
      #
      # As dependencias de sistema do WebKit sao ~125 pacotes (libwoff, libhyphen,
      # libmanette, gstreamer). Em 18/08 uma tentativa de 6 min morreu no meio do
      # download com o mirror azure respondendo Ign, por isso o teto por tentativa
      # e maior aqui do que a intuicao sugere.
      #
      # `pkill -x` casa NOME EXATO. A versao anterior usava `pkill -f
      # 'apt-get|dpkg'`, e o -f casa contra a linha de comando inteira: a linha do
      # proprio pkill contem "apt-get", entao ele se matava. O log de 18/08 mostra
      # "3451 Killed sudo pkill -9 -f 'apt-get|dpkg'".
      - name: Dependencias de sistema dos navegadores (apt)
        timeout-minutes: 22
        run: |
          limpar_apt() {
            sudo pkill -9 -x apt-get 2>/dev/null || true
            sudo pkill -9 -x dpkg 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock \
                       /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
          }
          for tentativa in 1 2; do
            # Sem -k, o GNU timeout manda SIGTERM e espera para sempre se o
            # apt-get neto ignorar o sinal. Em 19/08 o a11y ficou 11+ min no
            # primeiro install-deps (run 32263428277). -k 15 manda SIGKILL.
            if timeout -k 15 300 npx playwright install-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::tentativa $tentativa de instalar dependencias falhou ou travou em 5 min"
            limpar_apt
            sleep 10
          done
          echo "::error::duas tentativas de instalar as dependencias de sistema falharam"
          exit 1

      # Este e o passo que o cache serve. Com hit, sai em segundos.
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: npx playwright install chromium webkit

      - name: Build (produção, env placeholder)
        run: npm run build

      - name: Rotas principais sem erro de console sob a CSP de produção
        env:
          PF_EXPECT_PLACEHOLDER_DATA: "1"
        run: npx playwright test tests/visual/main-routes.spec.ts

      # Fluxos de lançamento (acesso interno, short link do quiz, página de
      # doadores) rodam com fixtures locais e sem segredo. O alerts-flow nasce
      # em /candidato/lula e precisa de dados reais: fica skipped aqui e segue
      # como checagem manual pré-lançamento (npm run test:playwright:launch
      # contra um servidor com dados reais).
      - name: Fluxos de lançamento (fixtures locais)
        env:
          PF_EXPECT_PLACEHOLDER_DATA: "1"
        # O rm evita que uma falha aqui publique o playwright-report/ verde do
        # step anterior (o launch config só usa reporter list) e confunda a
        # triagem pelo artifact.
        run: |
          rm -rf playwright-report
          npm run test:playwright:launch

      # Gate de a11y no PR (e tambem no push). O axe contra producao mora em
      # .github/workflows/a11y-producao.yml, que so dispara na main: assim o
      # PR nao lista um check "skipped". embed-candidate fica skipped com
      # placeholder.
      - name: Axe (build local)
        env:
          PF_EXPECT_PLACEHOLDER_DATA: "1"
        run: |
          rm -rf playwright-report
          npx playwright test tests/visual/a11y.spec.ts

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-browser-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
