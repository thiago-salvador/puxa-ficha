name: CI

# Roda em pushes e em PRs de qualquer fork. Não usa segredos, então
# funciona para qualquer colaborador externo sem acesso à infra do projeto.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O verify foi dividido em 29/09/2026: com a cobertura em shards (~7 min), ele
  # virou o caminho crítico (8,5 a 13,3 min, dos quais 4,7 a 7,5 do npm test).
  # `verify-estatico` e `verify-teste` rodam em paralelo; o job `verify` mantém
  # o nome do check obrigatório da main e da fila serial, e falha quando algum
  # dos dois não termina em success (job pulado conta como verde no branch
  # protection, por isso `if: always()`).
  verify-estatico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O auditor compara com o SHA imutável da base do evento. O checkout
          # raso padrão contém só o head e faz o gate falhar antes da auditoria.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Falha em vulnerabilidade high+ nas dependencias de producao (o que vai
      # pro browser/runtime). devDependencies (CLIs locais) ficam fora do gate.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Spellcheck (UI)
        run: npm run lint:spell:ui

      - name: Typecheck
        run: npm run typecheck

      # Os scripts de ingestão/auditoria têm tsconfig próprio e ficam fora do
      # typecheck do app; sem este passo, um script quebrado só falharia na
      # hora de rodar a ingestão agendada.
      - name: Typecheck (scripts)
        run: npm run check:scripts

      - name: Environment contract
        run: npm run check:env-contract

      # Valida data/candidatos.json (contrato, slugs únicos, colisões de
      # nome_urna, SQ duplicado). Local e sem segredo, então roda em qualquer
      # PR de fork. Sem este gate, um seed inválido passa no CI e só explode
      # na ingestão.
      - name: Validar seed
        run: npm run validate:seed

      # Foto de origem abaixo do slot em 2x (562x750) sai borrada na grade da
      # home; recompressão não conserta resolução que nunca existiu (G5-02).
      - name: Resolução das fotos de candidato
        run: npm run audit:fotos:gate

      # Remoção de foto só passa contra o SHA imutável da base do evento e o
      # snapshot público versionado. Não consulta rede nem banco no CI.
      - name: Referências runtime das fotos de candidato
        env:
          PF_CANDIDATE_ASSET_BASELINE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run audit:candidate-assets:gate

      - name: Dead code (knip)
        run: npm run check:dead-code
      - name: Queries Supabase com prazo (abortSignal)
        run: npm run audit:supabase-abort-signal

      # Escrita em produção fora de `escreverAuditado()` é escrita sem trilha, que
      # é a causa raiz da #131. A varredura é estática (lê `scripts/` e `src/`, não
      # toca no banco), então roda em PR de fork sem segredo nenhum. Gate que
      # ninguém executa é o padrão que esta issue existe para quebrar.
      - name: Escrita auditada (trilha obrigatória)
        run: npm run audit:escrita-auditada:gate

      # O repositório é público: CPF de pessoa real em arquivo rastreado fica
      # legível por qualquer um. A varredura é estática (git ls-files, sem rede
      # nem segredo) e a saída mostra só arquivo e linha, nunca o número.
      - name: CPF em arquivo versionado
        run: npm run audit:cpf-versionado:gate

      # Migration de dados nova exige três coisas no mesmo PR: anotações `@write`,
      # allowlist que autorize os pares (tabela, slug, campos) e entrada em
      # `recortes.json` ligando a janela à allowlist. O comando é estático, não
      # toca banco nem rede, então roda em PR de fork sem segredo nenhum.
      # Entrou no verify porque até 09/08/2026 ele saía vermelho por construção,
      # e gate que ninguém executa vira gate desligado: dois documentos chegaram
      # a declarar "allowlist OK" com ele em exit 1.
      - name: Allowlist de escrita (recortes e dívida congelada)
        run: npm run audit:cobertura:allowlist

      - name: Build
        # Valores de placeholder: o build não acessa o Supabase (as páginas
        # são renderizadas sob demanda). Um fork usa os próprios valores.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  verify-teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Mesmo histórico do verify-estatico: há testes que leem a base do evento.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # pdftotext sem apt: o poppler vem do conda-forge, com cache (ver a action).
      - name: Preparar leitura dos relatórios públicos em PDF
        timeout-minutes: 5
        uses: ./.github/actions/poppler

      - name: Install dependencies
        run: npm ci

      # Suíte inteira em paralelo (concorrência padrão do node:test). Não sai
      # do CI mesmo com a cobertura em shards: pega falhas que só aparecem com
      # testes rodando ao mesmo tempo, que a cobertura serial não vê.
      - name: Test
        run: npm test

  verify:
    needs: [verify-estatico, verify-teste]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Estático e testes passaram
        env:
          ESTATICO: ${{ needs.verify-estatico.result }}
          TESTE: ${{ needs.verify-teste.result }}
        run: |
          echo "verify-estatico: $ESTATICO"
          echo "verify-teste: $TESTE"
          test "$ESTATICO" = "success" && test "$TESTE" = "success"

  # H1 do master-review de 2026-08-28: os gates `audit:*` de dominio nao rodam em
  # PR nenhum. O `verify` roda `npm test`, que cobre boa parte dos testes de
  # dominio, mas os audits de integridade, escala e escopo so rodam no cron
  # seguinte, ou seja DEPOIS do merge. Um PR que quebra um invariante desses
  # passa com CI verde e a deteccao chega no dia seguinte.
  #
  # Job proprio e nao steps no `verify` por dois motivos: nao entra no caminho
  # critico de quem mexe em UI, e o recorte por path fica visivel num lugar so.
  #
  # RECORTE. Os paths abaixo foram medidos no repo, nao copiados do relatorio: os
  # dados de programas de governo vivem em `src/data/programas-governo*` e
  # `scripts/data/programas-governo*`, e os de pesquisas nao vivem em arquivo
  # nenhum (estao no banco), entao o gatilho de pesquisas e o codigo e os scripts.
  #
  # SEM SEGREDO, de proposito. Este workflow roda em PR de qualquer fork, e
  # `Settings/AUTOMATIONS_AND_ENVIRONMENTS.md` diz que PR nunca recebe credencial
  # de producao. Todo audit aqui e estatico: le arquivo do repo, nao consulta
  # Supabase nem rede.
  #
  # DOIS GRUPOS FICARAM DE FORA, e por motivos diferentes:
  #
  # 1. `audit:data-freshness` exige `--published=<snapshot.json>`, e esse
  #    snapshot sai de um `psql` com `SUPABASE_DB_URL` (data-freshness-audit.yml).
  #    Segredo de producao nao entra em PR. Continua no cron das 11:37 UTC.
  #
  # 2. Os `*:scope` (`audit:programas-governo:scope`,
  #    `audit:data-freshness:scope`) NAO sao auditoria
  #    de dominio: sao gates de ESCOPO DE BRANCH. Cada um carrega uma allowlist
  #    de arquivos que a branch daquele workstream pode tocar, e reprova qualquer
  #    arquivo fora dela. Rodar num job generico faz um PR de UI reprovar por
  #    tocar um arquivo de UI. Medido: a primeira versao deste job reprovou este
  #    proprio PR, que so muda `.github/workflows/ci.yml`. Eles continuam sendo
  #    rodados a mao por quem trabalha naquele recorte.
  audits-de-dominio:
    name: Auditorias de domínio (paths tocados)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Precisa do histórico para comparar com a base do PR.
          fetch-depth: 0

      # O classificador é código puro, versionado e testado. Ele cobre todos os
      # consumidores de programas e pesquisas pelo marcador do domínio, em vez
      # de depender de uma lista parcial de diretórios.
      - name: Validar classificador do recorte
        run: node --test tests/ci-domain-audit-paths.test.mjs

      - name: Decidir se os audits se aplicam a este diff
        id: recorte
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "base indisponível; roda por precaução"
            echo "aplica=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MUDADOS="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          APLICA="$(printf '%s\n' "$MUDADOS" | node scripts/audit/ci-domain-audit-paths.mjs)"
          printf '%s\n' "$MUDADOS"
          echo "aplica=$APLICA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.recorte.outputs.aplica == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.recorte.outputs.aplica == 'true'
        run: npm ci

      # Integridade dos registros de programa de governo e do inventário.
      - name: Programas de governo (integridade)
        if: steps.recorte.outputs.aplica == 'true'
        run: npm run audit:programas-governo

      - name: Programas de governo (inventário dos governadores)
        if: steps.recorte.outputs.aplica == 'true'
        run: npm run audit:programas-governo:governadores

      - name: Programas de governo (escala)
        if: steps.recorte.outputs.aplica == 'true'
        run: npm run audit:programas-governo:escala

      - name: Programas de governo (publicados batem com o inventário)
        if: steps.recorte.outputs.aplica == 'true'
        run: npm run audit:programas-governo:governadores:publicados

      - name: Pesquisas eleitorais (gate)
        if: steps.recorte.outputs.aplica == 'true'
        run: npm run audit:pesquisas:gate

  # A cobertura saiu do `verify` em 18/08/2026, medida antes de mexer: levava 347
  # dos 651 segundos do job, mais da metade. O comando roda a suite inteira uma SEGUNDA vez
  # com --test-concurrency=1, serial, o que explica ser quase o dobro do step
  # `Test`. Em job proprio ela roda em paralelo e sai do caminho critico. Em
  # 30/08/2026 os thresholds foram medidos localmente em Node 24: statements
  # 54,40%, branches 79,20%, functions 83,67% e lines 54,39%. Como todos ficam
  # acima dos pisos versionados, a cobertura passa a bloquear regressao real.
  #
  # Em 29/09/2026 o step serial chegou a 19,6 min (job de 16 a 21 min) e ja
  # tinha estourado o timeout antigo de 20. A suite roda agora em 4 shards
  # (--test-shard nativo do node:test, ainda serial dentro de cada shard), cada
  # um gravando o dump bruto do NODE_V8_COVERAGE. O dump e podado para src/ e
  # scripts/ (prova local: summary e lcov identicos byte a byte) e o job
  # `cobertura` junta tudo num unico `c8 report`, com os mesmos pisos.
  cobertura-shard:
    name: Cobertura (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # pdftotext sem apt: o poppler vem do conda-forge, com cache (ver a action).
      - name: Preparar leitura dos relatórios públicos em PDF
        timeout-minutes: 5
        uses: ./.github/actions/poppler

      - name: Install dependencies
        run: npm ci

      - name: Cobertura do shard
        env:
          COVERAGE_SHARD: ${{ matrix.shard }}/4
        run: npm run test:coverage:shard

      - name: Guardar dump podado
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: cobertura-v8-${{ matrix.shard }}
          path: .tmp/c8
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Nome igual ao check obrigatorio da main. `if: always()` porque um job pulado
  # por falha em `needs` conta como verde no branch protection: o primeiro step
  # falha explicitamente quando algum shard nao terminou em success.
  cobertura:
    name: Cobertura (bloqueante)
    needs: cobertura-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Todos os shards passaram
        env:
          SHARDS: ${{ needs.cobertura-shard.result }}
        run: |
          echo "shards: $SHARDS"
          test "$SHARDS" = "success"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Juntar dumps dos shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: cobertura-v8-*
          path: .tmp/c8
          merge-multiple: true

      # Thresholds do c8.config.json sao contrato de merge, nao telemetria.
      - name: Cobertura
        run: npm run test:coverage:report

  # O unico teste que pegaria a regressao de CSP de 03/08 (PR #71, nonce
  # removido, toda hidratacao bloqueada por ~12h) nunca rodava em PR:
  # main-routes falha em qualquer erro de console, e script inline barrado por
  # CSP sem nonce e exatamente esse sintoma. Este job builda o site em modo
  # producao (CSP com nonce, sem 'unsafe-inline') usando env placeholder (sem
  # segredo, funciona em PR de fork) e roda o teste contra o servidor local
  # que o playwright.config sobe sozinho. Rotas que so renderizam com dados
  # reais ficam de fora via PF_EXPECT_PLACEHOLDER_DATA: a CSP e global
  # (middleware + layout raiz), entao as rotas restantes detectam a mesma
  # classe de regressao. Prova registrada em 2026-08-04: com o nonce removido
  # localmente, todas as rotas falham com "Executing inline script violates
  # the following Content Security Policy directive 'script-src self'".
  # Roda dentro da imagem oficial do Playwright, na versão do package-lock: o
  # navegador e as dependências de sistema já vêm nela. Acabou o apt no runner,
  # que em 07/10/2026 caiu duas vezes seguidas com archive.ubuntu.com fora do ar
  # (run 37674397721), e acabou o download de ~250 MB por rodada.
  # Só roda quando o diff toca o que o app carrega (browser-smoke-recorte). Job
  # pulado conta como verde no branch protection; se o recorte falhar, este job
  # roda (needs.result != success), então a falha do recorte nunca vira verde.
  browser-smoke:
    name: Rotas e acessibilidade (build local)
    needs: browser-smoke-recorte
    if: always() && (needs.browser-smoke-recorte.result != 'success' || needs.browser-smoke-recorte.outputs.aplica == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.browser-smoke-recorte.outputs.playwright }}-noble
      options: --user 1001
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sem cache, cada rodada baixava de novo os ~250 MB de Chromium e WebKit.
      - name: Build (produção, env placeholder)
        run: npm run build

      - name: Rotas principais sem erro de console sob a CSP de produção
        env:
          PF_EXPECT_PLACEHOLDER_DATA: "1"
        run: npx playwright test tests/visual/main-routes.spec.ts

      # Fluxos de lançamento (acesso interno, short link do quiz, página de
      # doadores) rodam com fixtures locais e sem segredo. O alerts-flow nasce
      # em /candidato/lula e precisa de dados reais: fica skipped aqui e segue
      # como checagem manual pré-lançamento (npm run test:playwright:launch
      # contra um servidor com dados reais).
      - name: Fluxos de lançamento (fixtures locais)
        env:
          PF_EXPECT_PLACEHOLDER_DATA: "1"
        # O rm evita que uma falha aqui publique o playwright-report/ verde do
        # step anterior (o launch config só usa reporter list) e confunda a
        # triagem pelo artifact.
        run: |
          rm -rf playwright-report
          npm run test:playwright:launch

      # Gate de a11y no PR (e tambem no push). O axe contra producao mora em
      # .github/workflows/a11y-producao.yml, que so dispara na main: assim o
      # PR nao lista um check "skipped". embed-candidate fica skipped com
      # placeholder.
      - name: Axe (build local)
        env:
          PF_EXPECT_PLACEHOLDER_DATA: "1"
        run: |
          rm -rf playwright-report
          npx playwright test tests/visual/a11y.spec.ts

      - name: Build E2E isolado (pessoas fictícias, sem banco)
        env:
          PF_VISUAL_FIXTURE_BUILD: "1"
        run: npm run build

      - name: Regressões funcionais (quiz e interações)
        env:
          PF_EXPECT_PLACEHOLDER_DATA: "1"
          PF_VISUAL_FIXTURE_BUILD: "1"
        run: npx playwright test tests/visual/quiz.spec.ts tests/visual/interactions.spec.ts tests/visual/offline.spec.ts

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-browser-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Decide se o browser-smoke precisa rodar e lê a versão do Playwright para a
  # imagem. Push na main roda sempre; no PR, só quando o diff toca o que o app
  # carrega (scripts/ci/browser-smoke-paths.mjs, testado). Base indisponível
  # roda por precaução.
  browser-smoke-recorte:
    name: Recorte do smoke de rotas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aplica: ${{ steps.recorte.outputs.aplica }}
      playwright: ${{ steps.versao.outputs.v }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Versão do Playwright do package-lock
        id: versao
        run: |
          set -euo pipefail
          v="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::versão do Playwright inválida: $v"; exit 1; }
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Validar classificador do recorte
        run: node --test tests/ci-browser-smoke-paths.test.mjs

      - name: Decidir se o diff toca o app
        id: recorte
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" != "pull_request" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "aplica=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MUDADOS="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          APLICA="$(printf '%s\n' "$MUDADOS" | node scripts/ci/browser-smoke-paths.mjs)"
          printf '%s\n' "$MUDADOS"
          echo "aplica=$APLICA" >> "$GITHUB_OUTPUT"
