name: Monitoramento de pesquisas eleitorais

# Cron diário às 10:17 UTC. Cada operação validada pode ser publicada na rodada.
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Uma fonte aprovada ou todas"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "poderdata-aya-nacional-2026"
          - "datafolha-folha-globo-nacional-2026"
          - "datafolha-folha-globo-estaduais-2026"
          - "real-time-big-data-estaduais-2026"
      uf:
        description: "Uma UF, BR para Presidente ou all"
        required: true
        default: "all"
      publish:
        description: "Publicar operações validadas e promover a produção"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: pesquisas-monitoramento-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preparar-matriz:
    name: Preparar matriz aprovada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      expected: ${{ steps.matrix.outputs.expected }}
      discovery_status: ${{ steps.discovery.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências sem scripts de pacote
        run: npm ci --ignore-scripts

      - name: Provar fixtures e isolamento antes da rede
        run: |
          npm run test:pesquisas:monitoramento
          npm run test:pesquisas:monitoramento:isolamento
          npm run test:pesquisas:monitoramento:rede
          npm run test:pesquisas:integracao
          npm run check:scripts

      - name: Descobrir publicações além do catálogo
        id: discovery
        continue-on-error: true
        env:
          monitor_source_id: ${{ inputs.source_id || 'all' }}
        run: npm run monitor:pesquisas:descoberta -- --source "$monitor_source_id" --validate-targets --out reports/pesquisas-descoberta

      - name: Publicar descoberta e lacunas de cobertura
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pesquisas-descoberta-${{ github.run_id }}
          path: reports/pesquisas-descoberta/
          if-no-files-found: error
          retention-days: 14

      - name: Calcular todas as fontes e UFs aprovadas
        id: matrix
        env:
          monitor_source_id: ${{ inputs.source_id || 'all' }}
          monitor_uf: ${{ inputs.uf || 'all' }}
        run: |
          npm run pesquisas:atualizacao:matrix -- \
            --source="$monitor_source_id" \
            --uf="$monitor_uf" \
            --discovered-targets=reports/pesquisas-descoberta/discovered-targets.json \
            --out=reports/pesquisas-monitoramento/matrix.json

      - name: Publicar inventário da matriz
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pesquisas-monitoramento-matrix-${{ github.run_id }}
          path: reports/pesquisas-monitoramento/matrix.json
          if-no-files-found: error
          retention-days: 14

  coletar:
    name: Coletar ${{ matrix.target.source_id }} ${{ matrix.target.uf }}
    needs: preparar-matriz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.preparar-matriz.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências sem scripts de pacote
        run: npm ci --ignore-scripts

      - name: Preparar leitura dos relatórios públicos em PDF
        if: matrix.target.source_id == 'poderdata-aya-nacional-2026' || (matrix.target.source_id == 'real-time-big-data-estaduais-2026' && matrix.target.uf == 'PR')
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y poppler-utils
          pdftotext -v

      - name: Baixar descoberta validada
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pesquisas-descoberta-${{ github.run_id }}
          path: reports/pesquisas-descoberta

      - name: Conciliar catálogo e publicações descobertas
        env:
          monitor_source_id: ${{ matrix.target.source_id }}
          monitor_uf: ${{ matrix.target.uf }}
          monitor_key: ${{ matrix.target.key }}
        run: |
          npm run monitor:pesquisas -- \
            --out="reports/pesquisas-monitoramento/$monitor_key" \
            --source="$monitor_source_id" \
            --uf="$monitor_uf" \
            --discovery=reports/pesquisas-descoberta/discovery.json

      - name: Publicar artefato individual
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pesquisas-monitoramento-part-${{ matrix.target.key }}
          path: reports/pesquisas-monitoramento/${{ matrix.target.key }}/
          if-no-files-found: error
          retention-days: 14

  consolidar:
    name: Consolidar somente após todos os adaptadores
    if: always()
    needs:
      - preparar-matriz
      - coletar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      status: ${{ steps.consolidar.outputs.status }}
      execution_status: ${{ steps.consolidar.outputs.execution_status }}
      change_count: ${{ steps.consolidar.outputs.change_count }}
      operation_status: ${{ steps.consolidar.outputs.operation_status }}
      coverage_status: ${{ steps.consolidar.outputs.coverage_status }}
      promotion_authorized: ${{ steps.consolidar.outputs.promotion_authorized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências sem scripts de pacote
        run: npm ci --ignore-scripts

      - name: Baixar inventário esperado
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pesquisas-monitoramento-matrix-${{ github.run_id }}
          path: reports/matrix

      - name: Baixar todos os artefatos de coleta
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: pesquisas-monitoramento-part-*
          path: reports/parts

      - name: Falhar fechado se o inventário não estiver disponível
        run: |
          if [ ! -f reports/matrix/matrix.json ]; then
            mkdir -p reports/matrix
            echo '{"include":[{"key":"manifest-missing","source_id":"missing","uf":"missing","poll_ids":["manifest-missing"]}]}' > reports/matrix/matrix.json
          fi

      - name: Baixar diagnóstico independente de descoberta
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pesquisas-descoberta-${{ github.run_id }}
          path: reports/discovery

      - name: Consolidar e falhar fechado
        id: consolidar
        run: |
          npm run pesquisas:atualizacao:consolidate -- \
            --matrix=reports/matrix/matrix.json \
            --input=reports/parts \
            --discovery=reports/discovery/discovery.json \
            --out=reports/consolidated

      - name: Publicar resumo e proposta consolidada
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pesquisas-monitoramento-consolidado-${{ github.run_id }}
          path: reports/consolidated/
          if-no-files-found: error
          retention-days: 14

  promover:
    name: Publicar pesquisas validadas
    needs:
      - preparar-matriz
      - consolidar
    if: >-
      (needs.consolidar.outputs.promotion_authorized == 'true' || needs.consolidar.outputs.operation_status == 'no_changes') &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências sem scripts de pacote
        run: npm ci --ignore-scripts

      - name: Instalar Chrome para os checks de publicação
        run: npx playwright install --with-deps chromium chrome

      - name: Baixar proposta consolidada
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: pesquisas-monitoramento-consolidado-${{ github.run_id }}
          path: reports/consolidated

      - name: Publicar somente após validação independente
        env:
          MERGE_QUEUE_GH_TOKEN: ${{ secrets.MERGE_QUEUE_GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          POLL_REPOSITORY: ${{ github.repository }}
          POLL_BASE_SHA: ${{ github.sha }}
          POLL_RUN_ID: ${{ github.run_id }}
          POLL_AUTHOR_LOGIN: thiago-salvador
        run: node scripts/pesquisas-atualizacao-agendada/publicar.mjs
