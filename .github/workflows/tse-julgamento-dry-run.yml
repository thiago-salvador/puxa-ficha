name: Ensaio de situação de julgamento TSE 2026

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA de 40 caracteres já mergeado em main"
        required: true
        type: string

      cohort:
        description: "Coorte para ensaio somente leitura; nenhuma aplicação automática"
        required: true
        default: ficha-ma
        type: choice
        options:
          - ficha-ma
          - cinco-issue646
          - publicadas

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry-run da coorte de situação 2026
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PF_EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
    steps:
      - name: Validar main e SHA fechado
        env:
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          [[ "$PF_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PF_EXPECTED_SHA" = "$DISPATCH_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.expected_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências sem scripts
        run: npm ci --ignore-scripts

      - name: Confirmar que SHA continua no topo de main
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          test "$remote_sha" = "$PF_EXPECTED_SHA"

      - name: Executar dry-run revisável da coorte
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PF_JULGAMENTO_COHORT: ${{ github.event.inputs.cohort }}
        run: |
          set -euo pipefail
          case "$PF_JULGAMENTO_COHORT" in
            ficha-ma) export PF_INGEST_SLUGS=tse-2026-100002553336; export PF_EXPECTED_COHORT_COUNT=1 ;;
            cinco-issue646) export PF_INGEST_SLUGS=pedro-coutinho,emanuel-cacho,tse-2026-70002553751,izadora-dias,tse-2026-250002552955; export PF_EXPECTED_COHORT_COUNT=5 ;;
            publicadas) unset PF_INGEST_SLUGS; export PF_EXPECTED_COHORT_COUNT=all ;;
            *) exit 2 ;;
          esac
          umask 077
          private_dir="$(mktemp -d "${RUNNER_TEMP}/pf-julgamento.XXXXXX")"
          chmod 700 "$private_dir"
          raw_output="${RUNNER_TEMP}/pf-julgamento-stdout.json"

          node --import tsx scripts/ingest-tse-julgamento.ts \
            --dry-run "--snapshot-dir=$private_dir" > "$raw_output"

          node - "$raw_output" "$private_dir" <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs")
          const { join } = require("node:path")

          const output = JSON.parse(readFileSync(process.argv[2], "utf8"))
          const snapshotDir = process.argv[3]
          const snapshotEnvelope = JSON.parse(readFileSync(join(snapshotDir, "snapshot.json"), "utf8"))
          const snapshot = snapshotEnvelope.snapshot
          const report = JSON.parse(readFileSync(join(snapshotDir, "dry-run.json"), "utf8"))
          const summary = report.summary
          const outputCounts = [output.coorte, output.conferem, output.propostos, output.bloqueados]
          const reportCounts = [summary?.coorte, summary?.conferem, summary?.propostos, summary?.bloqueados]

          if (output.dry_run !== true || report.dry_run !== true || report.persisted !== 0) {
            throw new Error("O script não confirmou dry-run sem persistência")
          }
          if (snapshot.versao !== 1 || snapshotEnvelope.sha256 !== report.snapshot_sha256 || output.snapshot_sha256 !== report.snapshot_sha256) {
            throw new Error("Versão ou SHA do snapshot inválido")
          }
          if (!/^[0-9a-f]{64}$/.test(report.snapshot_sha256)) {
            throw new Error("SHA do snapshot inválido")
          }
          if (!outputCounts.every(Number.isSafeInteger) || !reportCounts.every(Number.isSafeInteger) ||
              outputCounts.some((count) => count < 0) || reportCounts.some((count) => count < 0) ||
              summary.coorte < 1 ||
              (process.env.PF_EXPECTED_COHORT_COUNT !== "all" && summary.coorte !== Number(process.env.PF_EXPECTED_COHORT_COUNT)) ||
              outputCounts.some((count, index) => count !== reportCounts[index])) {
            throw new Error("O ensaio precisa cobrir a coorte escolhida com contagens coerentes")
          }
          if (summary.coorte !== summary.conferem + summary.propostos + summary.bloqueados) {
            throw new Error("Conservação da coorte falhou")
          }

          const safeSummary = {
            versao: snapshot.versao,
            snapshot_sha: report.snapshot_sha256,
            coorte: summary.coorte,
            conferem: summary.conferem,
            propostos: summary.propostos,
            bloqueados: summary.bloqueados,
            persisted: 0,
          }
          const line = `${JSON.stringify(safeSummary)}\n`
          process.stdout.write(line)
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, line)
          if (summary.bloqueados > 0) process.exitCode = 2
          NODE
