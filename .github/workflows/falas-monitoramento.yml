name: Falas de candidatos na imprensa

on:
  # Complemento manual. A recorrência única de 48h é o heartbeat
  # falas-de-presidenci-veis-e-governadores (falas-rotina-48h.md).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: falas-monitoramento
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:falas && npm run check:scripts
      - name: Descobrir e verificar falas dos últimos 14 dias
        id: collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run monitor:falas
      - name: Guardar relatório, pendências e evidências
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: falas-${{ github.run_id }}
          path: reports/falas-monitoramento/
          if-no-files-found: error
          retention-days: 30
