name: Aplicar correção de fontes da issue 96

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA de 40 caracteres já mergeado em main"
        required: true

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Migration 20260825123000, ledger e readback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      PF_EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
    steps:
      - name: Validar ref e input
        env:
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          [[ "$PF_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PF_EXPECTED_SHA" = "$DISPATCH_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.expected_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12

      - name: Aplicar conjunto fechado e validar readback
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_REF: ${{ github.ref }}
        run: bash scripts/audit/apply-issue-96-production.sh
