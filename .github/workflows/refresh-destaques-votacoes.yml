name: Recoletar proveniência de destaques-votações

on:
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch:
    inputs:
      publish_evidence:
        description: >-
          Publicar em produção (INSERT em coleta_log) a evidência confirmada
          pela dupla leitura deste dispatch. Nunca ativo em run agendado.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: destaques-votacoes-provenance
  cancel-in-progress: false

jobs:
  collect:
    name: Dupla leitura oficial, sem escrita no banco
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PF_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Primeira leitura
        run: >-
          node --import tsx scripts/audit/coletar-destaques-votacoes.ts
          --out=reports/destaques-votacoes/run-a
          --execution-id=destaques-votacoes:gh-${{ github.run_id }}-a
          | tee reports/destaques-votacoes/run-a/stdout.json
      - name: Segunda leitura independente
        run: |
          sleep 5
          node --import tsx scripts/audit/coletar-destaques-votacoes.ts \
            --out=reports/destaques-votacoes/run-b \
            --execution-id=destaques-votacoes:gh-${{ github.run_id }}-b \
            | tee reports/destaques-votacoes/run-b/stdout.json
      - name: Comparar hashes e contrato
        run: >-
          node --import tsx scripts/audit/verify-destaques-votacoes-provenance.ts
          --run-a=reports/destaques-votacoes/run-a/manifest.json
          --run-b=reports/destaques-votacoes/run-b/manifest.json
          --out=reports/destaques-votacoes/double-read-receipt.json
      # Sobe mesmo quando a comparação reprova: sem os payloads brutos das duas
      # leituras não dá para diagnosticar uma divergência de hash (run
      # 33553696034, 01/09/2026, senado:7fa2b07b:4531 divergiu e o artifact
      # não subiu). `warn` porque uma falha antes da primeira leitura deixa o
      # diretório vazio, e aí o passo não deve mascarar a causa original.
      # `run-a/run-b/stdout.json` (tee acima) carrega `pares_fora_do_seed`, que
      # o job `publish` usa para o guard de contagem fora de escopo — sem
      # subir junto no mesmo artifact, o publish não teria como gerar o SQL.
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6.0.0
        with:
          name: destaques-votacoes-provenance-${{ github.run_id }}
          path: reports/destaques-votacoes
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publicar evidência confirmada em produção (coleta_log)
    needs: collect
    # Só roda em dispatch manual com o input explícito. `inputs.publish_evidence`
    # nem existe em run agendado (sem workflow_dispatch, sem inputs) — o guard
    # por github.event_name é redundante de propósito, para o contrato ficar
    # legível e testável sem depender de como a Actions resolve o context em
    # cada tipo de evento.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.publish_evidence == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: destaques-votacoes-provenance-${{ github.run_id }}
          path: reports/destaques-votacoes
      - name: Gerar SQL de evidência a partir da dupla leitura já verificada
        run: |
          set -euo pipefail
          excluded="$(node -e 'process.stdout.write(String(JSON.parse(require("node:fs").readFileSync("reports/destaques-votacoes/run-b/stdout.json","utf8")).pares_fora_do_seed.length))')"
          node --import tsx scripts/audit/generate-destaques-evidence-refresh.ts \
            --run-a=reports/destaques-votacoes/run-a/manifest.json \
            --run-b=reports/destaques-votacoes/run-b/manifest.json \
            --out=reports/destaques-votacoes/evidence-refresh \
            --execution-id=destaques-votacoes:gh-${{ github.run_id }}-evidence-refresh \
            --evidence-path=${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }} \
            --project-ref=wskpzsobvqwhnbsdsmok \
            --excluded-pairs="$excluded"
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      # A credencial de produção fica só neste passo: os anteriores (checkout,
      # setup-node, download do artifact, geração do SQL) não tocam o banco e
      # não precisam dela. Host, projeto e branch são confirmados dentro do
      # script antes de qualquer psql — mesmo padrão de
      # apply-destaques-freshness-reconciliation-production.sh.
      - name: Aplicar evidência confirmada em produção
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PF_APPLY_SQL: reports/destaques-votacoes/evidence-refresh/apply.sql
          PF_READBACK_SQL: reports/destaques-votacoes/evidence-refresh/readback.sql
        run: bash scripts/audit/apply-destaques-evidence-refresh-production.sh
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6.0.0
        with:
          name: destaques-votacoes-evidence-refresh-${{ github.run_id }}
          path: reports/destaques-votacoes/evidence-refresh
          if-no-files-found: warn
          retention-days: 30
