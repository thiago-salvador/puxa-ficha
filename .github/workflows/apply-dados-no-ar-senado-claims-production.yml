name: "Aplicar correções de dado no ar (situação no Senado, claim e cargo atual)"

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA de 40 caracteres já mergeado em main"
        required: true
      mode:
        description: "dry-run ensaia e desfaz; apply grava. O ensaio roda sempre antes."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: apply-dados-no-ar-senado-claims-production
  cancel-in-progress: false

jobs:
  apply:
    name: Três migrations de dado com ledger e readback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # PF_DATABASE_URL fica no env de cada passo que o usa, nunca no job: assim
    # o segredo não alcança npm ci nem as actions de terceiros.
    env:
      PF_EXPECTED_SHA: ${{ github.event.inputs.expected_sha }}
    steps:
      - name: Validar ref e input
        env:
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          PF_MODE: ${{ github.event.inputs.mode }}
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = "refs/heads/main"
          test "${#PF_EXPECTED_SHA}" -eq 40
          test "$PF_EXPECTED_SHA" = "$DISPATCH_SHA"
          test -n "${PF_DATABASE_URL:-}"
          case "$PF_MODE" in dry-run|apply) ;; *) echo "modo inválido: $PF_MODE" >&2; exit 1 ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.expected_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12

      - run: npm ci --ignore-scripts

      # Ordem de .coderabbit.yaml: dry-run antes de apply, sempre. O ensaio
      # roda a migration, o INSERT no ledger e o readback na mesma transacao e
      # termina em ROLLBACK, entao ele reprova aqui antes de qualquer escrita
      # ficar de pe. Nao ha caminho que escreva sem passar por este passo.
      - name: Ensaio (dry-run, não grava)
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/apply-dados-no-ar-senado-claims-production.sh dry-run

      - name: Aplicar conjunto fechado
        if: ${{ github.event.inputs.mode == 'apply' }}
        env:
          PF_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/audit/apply-dados-no-ar-senado-claims-production.sh apply
