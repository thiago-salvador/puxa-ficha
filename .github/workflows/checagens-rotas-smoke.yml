name: Smoke live das rotas de checagens

# Sonda externa de diagnóstico. Não participa dos checks de PR; pode ser
# iniciada manualmente ou executa semanalmente para detectar mudanças nas fontes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    name: Rotas externas de checagens
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rotas diretas de checagens (sonda live)
        run: node --conditions react-server --import tsx scripts/audit/checagens-rotas-smoke.ts
