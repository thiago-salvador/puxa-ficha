name: Serial merge queue

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
      - labeled
      - unlabeled
  workflow_run:
    workflows:
      - CI
      - Replay real de migrations
      - Acessibilidade (produção)
      - Ledger vs repositório
      - Staged production release
    types:
      - completed
  status:
  deployment_status:
  # cron-watchdog: skipped-ok-com-gate-desligado
  # Enquanto SERIAL_MERGE_QUEUE_ENABLED não for "true", todos os jobs são
  # pulados e a execução agendada conclui "skipped". O watchdog de crons lê
  # este marcador e trata a pulada declarada como estado esperado, em vez de
  # abrir issue todo dia. Com a fila ativa, a execução volta a exigir sucesso.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Eventos simultâneos viram uma fila de execuções. O lock persistente em labels
# continua protegendo a operação entre execuções e durante recovery.
concurrency:
  group: serial-merge-queue
  cancel-in-progress: false

# O coordenador usa MERGE_QUEUE_GH_TOKEN, com escopo próprio. O GITHUB_TOKEN
# implícito serve somente para ler a default branch no checkout confiável.
permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile serial merge queue
    if: vars.SERIAL_MERGE_QUEUE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Nenhum campo do evento ou do PR entra no shell. O motor consulta as
      # APIs e trata título, branch, labels e conteúdo do PR apenas como dados.
      - name: Reconcile
        env:
          MERGE_QUEUE_GH_TOKEN: ${{ secrets.MERGE_QUEUE_GH_TOKEN }}
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MERGE_QUEUE_GH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/merge-queue/coordinator.mjs reconcile --config .github/serial-merge-queue.json
