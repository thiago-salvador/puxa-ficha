name: Qualidade de dados

# Auditorias periódicas de correção dos dados publicados. Complementam os
# gates que já rodam em outro lugar:
#
#   - CI (por PR): validate:seed, check:scripts, testes
#   - Vercel cron (diário): published-consistency (contrato DB<->UI),
#     runtime-smoke
#   - link-check-fontes.yml (semanal): URLs de fontes de pontos de atenção
#
# O que ESTE workflow cobre, e que nada acima cobre:
#
#   ids-cohort (semanal)  Confere cada ids.camara/ids.senado do seed contra a
#                         API oficial (nome e UF batem?). Um ID errado ancora
#                         a ingestão na pessoa errada; foi classe de erro real
#                         (homônimos, docs/homonimos-historico-2026-07-26.md).
#
#   public-surface        Roda os audits de superfície pública com a chave
#   (semanal)             ANON: vazamento de CPF/CNPJ em texto publicado e
#                         superfície de segurança (o que o anônimo consegue
#                         ler além do contrato). Precisa de SUPABASE_ANON_KEY,
#                         não da service role: o ponto é ver o que o público vê.
#
#   sq-identity (mensal)  Reconfere cada ids.tse_sq_candidato[ano] do seed
#                         contra o pacote consulta_cand do TSE. SQ errado é o
#                         pior erro do resolver (ancora a pessoa errada com
#                         confiança máxima; incidentes dos PRs #32/#33/#34).
#                         Mensal porque o insumo (pacote TSE + seed) muda
#                         devagar e o download é pesado.
#
# A falha do job É o alerta (GitHub notifica falha de scheduled workflow).
# Nenhum job escreve no banco: tudo é leitura e relatório.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY (só para o job public-surface; a anon key
#   já é pública por natureza, embarcada no bundle do site)

on:
  schedule:
    # Quintas às 09:00 UTC (06:00 em Brasília): ids-cohort + public-surface.
    - cron: "0 9 * * 4"
    # Dia 3 de cada mês às 07:00 UTC: sq-identity.
    - cron: "0 7 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-quality
  cancel-in-progress: false

jobs:
  ids-cohort:
    name: IDs Câmara/Senado vs API oficial
    runs-on: ubuntu-latest
    # 30 minutos era o valor original e a primeira execucao real na main provou
    # que nao serve: o job foi cortado exatamente no limite (run 30537319506,
    # 11:07:23 -> 11:37:38). O script consulta as APIs da Camara e do Senado
    # para 87 slugs com retry e espera entre chamadas, e no runner isso e bem
    # mais lento que em rede local. 90 minutos da folga sem virar job zumbi.
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Health check remoto (falha em mismatch, not_found ou error)
        run: npm run audit:ids-cohort:gate

  public-surface:
    name: Superfície pública (exposição de documento + segurança)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Validar secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL e/ou SUPABASE_ANON_KEY ausentes nos Actions secrets." >&2
            exit 1
          fi
      - name: Exposição de documento (CPF/CNPJ) em texto publicado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run audit:public-document-exposure:gate
      - name: Superfície de segurança com chave anônima
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run audit:public-security-surface:gate

      # Marcador tecnico do TSE (#NULO#, #NE#) vazando como texto publicado. O
      # script existia desde 07/08 e nao estava em workflow nenhum, entao nao
      # guardava nada: o master review de 18/08 achou 3 fichas publicadas
      # mostrando '#NULO#' como descricao de bem. A varredura da base inteira
      # achou 21 linhas e 185 bens, porque 18 estavam em ficha nao publicada e o
      # gate so olha o recorte publicado. Limpo em 18/08, e o gate entra
      # BLOQUEANTE agora que sai verde: gate que nasce vermelho vira gate
      # desligado.
      - name: Marcador tecnico do TSE em texto publicado
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run audit:marcadores-tse:gate

  # G6 (validade temporal). O instrumento nasceu em 17/08 e continua como fila
  # informativa até existir baseline/delta confiável para separar estoque
  # histórico de regressão nova. Não há gate strict artificial neste workflow.
  #
  # A fila informativa continua existindo porque, medido em 18/08, reprova com 677
  # afirmacoes com prazo em 178 das 208 fichas (520 vencidas, 157 sem data de
  # verificacao). Sem baseline/delta confiável, torná-la bloqueante manteria o
  # job vermelho por construção e não produziria um alerta acionável.
  #
  # A falha do job E o alerta, como diz o cabecalho deste arquivo. O numero de
  # achados aparece no log de cada rodada, entao a fila fica visivel e a queda
  # mensuravel.
  #
  validade-temporal:
    name: Validade temporal das afirmações (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Validar token da Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente nos Actions secrets." >&2
            exit 1
          fi
      - name: Fila de afirmações vencidas ou sem data
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run audit:validade-temporal

  sq-identity:
    name: SQ do seed vs consulta_cand do TSE
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 7 3 * *'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Cache dos pacotes consulta_cand
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tse-audit-cache
          key: tse-audit-cache-${{ runner.os }}-v1
      - run: npm ci
      - name: Auditar identidade dos SQ (gate)
        run: npm run audit:seed-sq-identity:gate

  superficie-fichas:
    # Versão mecânica da regra de 15/08 (incidente Augusto Cury): ficha pública
    # precisa de selo resolvível, >= 1 destaque visível, as duas fontes de
    # coleta com linha válida e ultima_atualizacao. O snapshot sai por psql
    # (mesmo secret e receita do ledger-guard) e o julgamento é script puro,
    # testado offline em tests/audit-superficie.test.ts. O mesmo snapshot cobre
    # R8-R10 da cadeia partidária, inclusive backlog ainda não público.
    name: Superfície e integridade das fichas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Checar secret antes de tocar o banco
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::SUPABASE_DB_URL ausente nos Actions secrets. É o mesmo secret do backup-db.yml." >&2
            exit 1
          fi
      - run: npm ci
      - uses: ./.github/actions/install-postgresql-client-17
        timeout-minutes: 12
      - name: Snapshot da superfície (SELECT, nenhuma escrita)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atq \
            -f scripts/audit/superficie-snapshot.sql > superficie.json
      - name: Julgar superfície (script puro)
        run: |
          set -euo pipefail
          args=(--from-snapshot=superficie.json --json=superficie-report.json)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args+=(--strict-all)
          fi
          npx tsx scripts/audit/audit-superficie.ts "${args[@]}"
      - name: Preservar receipt da superfície
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v6.0.0
        with:
          name: superficie-fichas-${{ github.run_id }}
          path: superficie-report.json
          if-no-files-found: error
          retention-days: 30
