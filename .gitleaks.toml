# Configuração do gitleaks para o Puxa Ficha.
# Estende as regras padrão e limita cada falso positivo conhecido ao valor
# público exato, à regra que o sinaliza e ao arquivo em que ele ocorre.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Identificador público do beacon da Cloudflare"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^f47edf88957444dc83600ce372955b50$''']
  paths = ['''^src/components/CloudflareWebAnalytics\.tsx$''']

  [[rules.allowlists]]
  description = "Hostname público sinalizado pelo detector genérico"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^gabriel15\.com\.br$''']
  paths = ['''^src/lib/remote-image-hosts\.ts$''']

  [[rules.allowlists]]
  description = "IDs públicos de proposições do SAPL"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^(TO-SAPL-12798|TO-SAPL-12705|TO-SAPL-12658)$''']
  paths = ['''^supabase/migrations/20260510183000_seed_projetos_lei_amelio_soldado_sapl_completo\.sql$''']

  [[rules.allowlists]]
  description = "ID público da votação do Senado"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^539f836a-197b-4176-9861-d58759a5c73b$''']
