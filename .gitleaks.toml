# Configuração do gitleaks para o Puxa Ficha.
# Estende as regras padrão e suprime falsos positivos conhecidos: o detector
# genérico de "api-key" marca IDs públicos, slugs e o identificador público do
# beacon da Cloudflare, que precisam aparecer no cliente e não são segredos.
[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conhecidos (dados públicos, não segredos)"
regexTarget = "line"
regexes = [
  # IDs de proposição de sistemas legislativos (SAPL etc.), dado público
  '''proposicao_id_api''',
  # Identificador público que o beacon da Cloudflare inclui no HTML do cliente
  '''CLOUDFLARE_WEB_ANALYTICS_TOKEN''',
  # Slug público cujo trecho "api" aciona por engano o detector genérico
  '''joao-capiberibe''',
]
paths = [
  # lista de hosts de imagem permitidos (hostnames públicos, não segredos)
  '''src/lib/remote-image-hosts\.ts''',
]
